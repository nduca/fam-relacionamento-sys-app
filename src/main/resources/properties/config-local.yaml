#  This file contains properties meant to be used in local Environment

environment:
  name: "LOCAL"

#Gateway defaults
api:
  id: "9999999"

# API FAM
fam:
  host: "api-ps-d.vemprafam.com.br"
  port: "443"
  token:
    basePath: "/fam.authentication"
    candidatoPath: "/api/v1/Login/Candidato"
    parceiroPath: "/api/v1/Login/Parceiro"
    os:
      ttl: "50"
      interval: "5"
    cache:
      keyExpression: "token"
    parameters:
      userIdentity: "teste"
      passwordIdentity: "teste"
    auth:
      clientInfo: "1"
      grantType: "client_credentials"
  api:
    workflowBasePath: "/fam.workflow"
    cursosPath: "/api/v1/ProcessoSeletivo/GetCursos"
    turnosPath: "/api/v1/ProcessoSeletivo/GetTurnos"
    polosPath: "/api/v1/ProcessoSeletivo/GetPolos"
    formasIngressoPath: "/api/v1/ProcessoSeletivo/GetFormaIngresso"